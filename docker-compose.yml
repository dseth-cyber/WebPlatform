services:
  postgres:
    image: postgres:16-alpine
    container_name: chiotron_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lohakit_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-LohakitSecurePostgres2026!}
      POSTGRES_DB: ${DB_NAME:-lohakit_cms}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lohakit_admin} -d ${DB_NAME:-lohakit_cms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chiotron_net

  minio:
    image: minio/minio:latest
    container_name: chiotron_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lohakit_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-LohakitMinIOSecureKey2026!}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - chiotron_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chiotron_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: 8080
      BASE_URL: ${BASE_URL:-https://localhost}
      DATABASE_URL: postgres://${DB_USER:-lohakit_admin}:${DB_PASSWORD:-LohakitSecurePostgres2026!}@postgres:5432/${DB_NAME:-lohakit_cms}?sslmode=disable
      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-lohakit_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-LohakitMinIOSecureKey2026!}
      MINIO_BUCKET: lohakit-media
      MINIO_USE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:-super-secret-random-32-byte-hex-key-here}
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8080,http://localhost,https://localhost,http://192.168.30.77,https://192.168.30.77,http://192.168.60.77,https://192.168.60.77,http://100.75.37.13,https://100.75.37.13,*"
      MAX_UPLOAD_MB: 50
    ports:
      - "8080:8080"
    volumes:
      - local_storage:/app/storage/uploads
    networks:
      - chiotron_net

  nginx:
    image: nginx:alpine
    container_name: chiotron_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - chiotron_net

volumes:
  postgres_data:
  minio_data:
  local_storage:

networks:
  chiotron_net:
    driver: bridge
